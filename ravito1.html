<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pointage Poste</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root {
      --primary: #2563eb;
      --success: #16a34a;
      --slate: #0f172a;
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #cbd5e1;
      --text: #1e293b;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 14px;
      display: flex;
      justify-content: center;
    }
    .card {
      background: var(--card);
      width: 100%;
      max-width: 440px;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      box-sizing: border-box;
    }
    h2 {
      text-align: center;
      margin-top: 0;
      font-size: 20px;
    }
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 10px;
      display: block;
      box-sizing: border-box;
      text-align: center;
    }
    .btn-qr { background: var(--slate); color: white; }
    .btn-man { background: #e2e8f0; color: var(--text); }
    .btn-primary { background: var(--primary); color: white; }
    .btn-success { background: var(--success); color: white; font-size: 18px; margin-top: 14px; }
    
    #reader {
      width: 100%;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 12px;
      display: none;
      background: #000;
    }
    .search-group {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }
    input {
      flex: 1;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 16px;
      box-sizing: border-box;
    }
    .search-group button {
      padding: 0 18px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    .recap-card {
      background: #f1f5f9;
      border: 2px solid #94a3b8;
      border-radius: 10px;
      padding: 16px;
      margin-top: 14px;
      text-align: center;
    }
    .recap-title {
      font-size: 13px;
      text-transform: uppercase;
      font-weight: 700;
      color: #64748b;
      margin-bottom: 4px;
    }
    .recap-name {
      font-size: 20px;
      font-weight: 700;
      margin: 4px 0;
      color: var(--slate);
    }
    .recap-badge {
      display: inline-block;
      background: #dbeafe;
      color: #1e40af;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 15px;
      font-weight: 700;
      margin: 8px 0;
    }
    #status {
      text-align: center;
      font-weight: 600;
      margin: 12px 0;
      font-size: 14px;
    }
    .toast-box {
      background: #dcfce7;
      color: #166534;
      padding: 14px;
      border-radius: 8px;
      font-weight: 600;
      text-align: center;
      margin-bottom: 14px;
      display: none;
      border: 1px solid #86efac;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2 id="titrePoste">Pointage</h2>
    
    <div id="toastMessage" class="toast-box"></div>

    <!-- Choix des modes -->
    <div id="choixBox">
      <button class="btn btn-qr" type="button" onclick="ouvrirScanner()">📷 Scanner QR Code</button>
      <button class="btn btn-man" type="button" onclick="ouvrirManuel()">✍️ Saisie Manuelle Numéro</button>
    </div>

    <!-- Viseur Caméra -->
    <div id="reader"></div>

    <!-- Boîte Saisie Manuelle / Correction -->
    <div id="boxManuel" style="display:none;">
      <label style="font-size:13px; font-weight:600; display:block; margin-bottom:4px;">N° Billet ou N° Manuel :</label>
      <div class="search-group">
        <input type="text" id="inputQuery" placeholder="Ex: 203492895 ou 101">
        <button type="button" onclick="declencherRecherche()">Rechercher</button>
      </div>
      <button class="btn btn-man" type="button" onclick="annulerSaisie()">Fermer</button>
    </div>

    <div id="status"></div>

    <!-- Récapitulatif Groupe avec confirmation -->
    <div id="recapBox" class="recap-card" style="display:none;">
      <div class="recap-title" id="dispNumPart"></div>
      <div class="recap-name" id="dispNom"></div>
      <div class="recap-badge" id="dispNb"></div>
      <button class="btn btn-success" type="button" id="btnValiderPassage" onclick="soumettrePassage()">✅ Valider le Passage</button>
      <button class="btn btn-man" type="button" onclick="annulerSelection()">Modifier le numéro / Annuler</button>
    </div>
  </div>

  <script>
    // -----------------------------------------------------------------
    // CONFIGURATION : Changez POSTE_ID ("ravito1", "ravito2" ou "arrivee")
    // -----------------------------------------------------------------
    const POSTE_ID = "ravito1"; 
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzfCGPbUKUan-c8707B38KZGlf63GFRwBD70sW0ugZK9Sk_-Wkt75aGG1Z2qWnAoY6d-g/exec";
    // -----------------------------------------------------------------

    let html5QrCode = null;
    let groupeTrouve = null;

    // Titre dynamique adapté
    const titreEl = document.getElementById("titrePoste");
    if (POSTE_ID === "ravito1") titreEl.textContent = "🍎 Ravitaillement 1";
    else if (POSTE_ID === "ravito2") titreEl.textContent = "🥖 Ravitaillement 2";
    else if (POSTE_ID === "arrivee") titreEl.textContent = "🏁 Arrivée";

    // Décodage Base64 HelloAsso
    function extraireNumeroBillet(texteScanne) {
      var texte = (texteScanne || "").trim();
      if (/^\d+$/.test(texte)) return texte;
      try {
        var decodage = atob(texte);
        if (decodage.indexOf(":") !== -1) {
          return decodage.split(":")[0].trim();
        }
      } catch (e) {}
      return texte;
    }

    // 1. SCANNER QR CODE
    function ouvrirScanner() {
      masquerRecap();
      document.getElementById("boxManuel").style.display = "none";
      const reader = document.getElementById("reader");
      reader.style.display = "block";

      html5QrCode = new Html5Qrcode("reader");
      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 12, qrbox: { width: 220, height: 220 } },
        (decodedText) => {
          const numPropre = extraireNumeroBillet(decodedText);
          html5QrCode.stop().then(() => {
            reader.style.display = "none";
          }).catch(() => {});
          
          document.getElementById("inputQuery").value = numPropre;
          chercherParticipant(numPropre);
        },
        () => {}
      ).catch(err => {
        const s = document.getElementById("status");
        s.style.color = "red";
        s.textContent = "Impossible d'accéder à la caméra : " + err;
      });
    }

    // 2. MODE MANUEL
    function ouvrirManuel() {
      if (html5QrCode) {
        try { html5QrCode.stop(); } catch(e) {}
        document.getElementById("reader").style.display = "none";
      }
      masquerRecap();
      document.getElementById("boxManuel").style.display = "block";
      const input = document.getElementById("inputQuery");
      input.focus();
    }

    function declencherRecherche() {
      const brute = document.getElementById("inputQuery").value.trim();
      const numPropre = extraireNumeroBillet(brute);
      document.getElementById("inputQuery").value = numPropre; // Remplace à l'écran par le numéro propre
      chercherParticipant(numPropre);
    }

    document.getElementById("inputQuery").addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        declencherRecherche();
      }
    });

    // 3. RECHERCHE EN BASE DE DONNÉES
    function chercherParticipant(query) {
      if (!query) {
        const s = document.getElementById("status");
        s.style.color = "red";
        s.textContent = "Veuillez renseigner un numéro.";
        return;
      }

      const s = document.getElementById("status");
      s.style.color = "#1e293b";
      s.textContent = `Recherche du groupe #${query}...`;
      masquerRecap();

      fetch(`${SCRIPT_URL}?action=findGroupe&query=${encodeURIComponent(query)}`, {
        method: "GET",
        redirect: "follow"
      })
      .then(r => r.json())
      .then(d => {
        if (d && d.found) {
          groupeTrouve = d;
          document.getElementById("dispNumPart").textContent = `N° Participation : ${d.numGroupe}`;
          document.getElementById("dispNom").textContent = `${d.nom} ${d.prenom}`;
          document.getElementById("dispNb").textContent = `👥 Groupe de ${d.nbPers} personne(s)`;
          
          document.getElementById("recapBox").style.display = "block";
          s.textContent = "";
        } else {
          s.style.color = "red";
          s.textContent = `Groupe ou billet #${query} non reconnu dans la base.`;
        }
      })
      .catch(() => {
        s.style.color = "red";
        s.textContent = "Erreur de connexion au serveur.";
      });
    }

    // 4. VALIDATION DU PASSAGE
    function soumettrePassage() {
      if (!groupeTrouve) return;

      const btn = document.getElementById("btnValiderPassage");
      btn.disabled = true;
      const s = document.getElementById("status");
      s.style.color = "#1e293b";
      s.textContent = "Enregistrement du passage...";

      fetch(SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          action: "pointerPassage",
          poste: POSTE_ID,
          numGroupe: groupeTrouve.numGroupe
        })
      })
      .then(r => r.json())
      .then(res => {
        if (res && res.success) {
          const nomPoste = POSTE_ID === "arrivee" ? "Arrivée" : (POSTE_ID === "ravito1" ? "Ravitaillement 1" : "Ravitaillement 2");
          afficherSucces(`✅ Passage ${nomPoste} validé !<br><strong>${groupeTrouve.nom}</strong> (${groupeTrouve.nbPers} pers.)`);
        } else {
          s.style.color = "red";
          s.textContent = "Erreur : " + (res.error || "échec de l'enregistrement.");
          btn.disabled = false;
        }
      })
      .catch(() => {
        s.style.color = "red";
        s.textContent = "Erreur de transmission réseau.";
        btn.disabled = false;
      });
    }

    function afficherSucces(messageHtml) {
      const toast = document.getElementById("toastMessage");
      toast.innerHTML = messageHtml;
      toast.style.display = "block";
      masquerRecap();
      document.getElementById("inputQuery").value = "";
      document.getElementById("status").textContent = "";
      document.getElementById("btnValiderPassage").disabled = false;
      setTimeout(() => { toast.style.display = "none"; }, 5000);
    }

    function masquerRecap() {
      document.getElementById("recapBox").style.display = "none";
      groupeTrouve = null;
    }

    function annulerSaisie() {
      document.getElementById("boxManuel").style.display = "none";
      document.getElementById("status").textContent = "";
      masquerRecap();
    }

    function annulerSelection() {
      masquerRecap();
      document.getElementById("boxManuel").style.display = "block";
      const input = document.getElementById("inputQuery");
      input.focus();
      input.select();
    }
  </script>
</body>
</html>
