<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suivi des Participants</title>
  <style>
    :root {
      --primary: #0066cc;
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #cbd5e1;
      --text: #1e293b;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
    }
    .container {
      background: var(--card);
      width: 100%;
      max-width: 480px;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      box-sizing: border-box;
    }
    h2 {
      margin-top: 0;
      margin-bottom: 20px;
      text-align: center;
      font-size: 22px;
    }
    fieldset {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 16px;
    }
    legend {
      font-weight: 600;
      font-size: 14px;
      padding: 0 6px;
      color: var(--primary);
    }
    .form-group {
      margin-bottom: 12px;
    }
    .form-group:last-child {
      margin-bottom: 0;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 16px; /* 16px évite le zoom auto sur iPhone */
      box-sizing: border-box;
      outline: none;
    }
    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(0, 102, 204, 0.2);
    }
    .row {
      display: flex;
      gap: 10px;
    }
    .row .form-group {
      flex: 1;
    }
    button {
      width: 100%;
      padding: 14px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }
    button:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
    }
    #message {
      text-align: center;
      font-weight: 500;
      margin-top: 14px;
      font-size: 15px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Fiche Participant</h2>
    
    <form id="suiviForm">

      <!-- Identification -->
      <fieldset>
        <legend>Identification</legend>
        <div class="row">
          <div class="form-group">
            <label for="numero">N° Participation *</label>
            <input type="text" id="numero" required placeholder="Ex: 104">
          </div>
          <div class="form-group">
            <label for="nbPersonnes">Nb personnes *</label>
            <input type="number" id="nbPersonnes" min="1" value="1" required>
          </div>
        </div>
        <div class="row">
          <div class="form-group">
            <label for="nom">Nom *</label>
            <input type="text" id="nom" required>
          </div>
          <div class="form-group">
            <label for="prenom">Prénom *</label>
            <input type="text" id="prenom" required>
          </div>
        </div>
      </fieldset>

      <!-- Contact -->
      <fieldset>
        <legend>Contact</legend>
        <div class="form-group">
          <label for="email">Adresse mail</label>
          <input type="email" id="email" placeholder="nom@exemple.fr">
        </div>
        <div class="form-group">
          <label for="telephone">Téléphone</label>
          <input type="tel" id="telephone" placeholder="06 12 34 56 78">
        </div>
      </fieldset>

      <!-- Horaires et Contrôles -->
      <fieldset>
        <legend>Pointages Horaires</legend>
        <div class="row">
          <div class="form-group">
            <label for="heureDepart">Départ</label>
            <input type="time" id="heureDepart">
          </div>
          <div class="form-group">
            <label for="heureRavitaillement1">Ravitaillement 1</label>
            <input type="time" id="heureRavitaillement1">
          </div>
        </div>
        <div class="row">
          <div class="form-group">
            <label for="heureRavitaillement2">Ravitaillement 2</label>
            <input type="time" id="heureRavitaillement2">
          </div>
          <div class="form-group">
            <label for="heureArrivee">Arrivée</label>
            <input type="time" id="heureArrivee">
          </div>
        </div>
      </fieldset>

      <button type="submit" id="btnSubmit">Enregistrer le participant</button>
      <div id="message"></div>
    </form>
  </div>

  <script>
    // METTEZ VOTRE LIEN APPS SCRIPT (/exec) ICI
    const SCRIPT_URL = "VOTRE_URL_GOOGLE_APPS_SCRIPT_ICI";

    document.getElementById("suiviForm").addEventListener("submit", function(e) {
      e.preventDefault();
      
      const btn = document.getElementById("btnSubmit");
      const msg = document.getElementById("message");

      btn.disabled = true;
      msg.style.color = "#1e293b";
      msg.textContent = "Enregistrement en cours...";

      const payload = {
        numero: document.getElementById("numero").value,
        nom: document.getElementById("nom").value,
        prenom: document.getElementById("prenom").value,
        nbPersonnes: document.getElementById("nbPersonnes").value,
        email: document.getElementById("email").value,
        telephone: document.getElementById("telephone").value,
        heureDepart: document.getElementById("heureDepart").value,
        heureRavitaillement1: document.getElementById("heureRavitaillement1").value,
        heureRavitaillement2: document.getElementById("heureRavitaillement2").value,
        heureArrivee: document.getElementById("heureArrivee").value
      };

      fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify(payload)
      })
      .then(() => {
        msg.style.color = "#16a34a";
        msg.textContent = "Enregistré avec succès !";
        document.getElementById("suiviForm").reset();
      })
      .catch(err => {
        console.error(err);
        msg.style.color = "#dc2626";
        msg.textContent = "Erreur lors de l'enregistrement.";
      })
      .finally(() => {
        btn.disabled = false;
      });
    });
  </script>
</body>
</html>
